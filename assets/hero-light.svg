<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="BASUH — Software Engineer. Architecture, applied AI, full-stack.">
  <style>
    .a { transform-box: fill-box; transform-origin: center; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fadeRight { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.2); } 65% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes ring { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(3.4); opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: .75; transform: scale(1.06); } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    @keyframes nudge { 0%, 70%, 100% { transform: translateX(0); } 80% { transform: translateX(5px); } }
    @keyframes sweep { from { transform: translateX(-420px) skewX(-20deg); } to { transform: translateX(1620px) skewX(-20deg); } }
    @keyframes gone { to { opacity: 0; visibility: hidden; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .motion { display: none; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="16"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D0D7DE"/></pattern>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969DA" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0969DA" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0969DA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#dots)" opacity=".45"/>
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#0969DA" stop-opacity=".35"/><stop offset="1" stop-color="#0969DA" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0969DA" stop-opacity="0"/>
      <stop offset=".45" stop-color="#0969DA" stop-opacity="1"/>
      <stop offset=".55" stop-color="#8250DF" stop-opacity="1"/>
      <stop offset="1" stop-color="#8250DF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="620 0" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <circle cx="980" cy="150" r="190" fill="url(#glow)" class="a" style="animation: breathe 5s ease-in-out 1s infinite both"/>
  <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="18" fill="#0969DA">$ whoami</text>
  <rect class="motion" x="62" y="66" width="92.39999999999999" height="26" fill="#FFFFFF" style="transform-box: view-box; animation: typeCover8_18 0.72s steps(8) 0.3s both, gone .01s linear 1.02s forwards"/>
  <style>@keyframes typeCover8_18 { from { transform: translateX(0); } to { transform: translateX(92.4px); } } @keyframes typeCursor8_18 { from { transform: translateX(0); } to { transform: translateX(86.4px); } }</style>
  <g class="motion" style="transform-box: view-box; animation: typeCursor8_18 0.72s steps(8) 0.3s both"><rect x="66" y="69" width="10" height="18" fill="#0969DA" style="animation: blink 1s step-end 0.3s infinite"/></g>
  <text class="a" x="60" y="160" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#1F2328" letter-spacing="2" style="animation: fadeUp 0.8s cubic-bezier(.2,.8,.2,1) 1.1s both">BASUH</text>
  <text x="60" y="160" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="url(#shine)" letter-spacing="2" class="motion">BASUH</text>
  <text class="a" x="64" y="206" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="28" fill="#656D76" style="animation: fadeUp 0.7s cubic-bezier(.2,.8,.2,1) 1.4s both">Software Engineer</text>
  <rect x="64" y="228" width="56" height="3" rx="1.5" fill="#0969DA" style="transform-box: fill-box; transform-origin: 0% 50%; animation: grow .7s cubic-bezier(.2,.8,.2,1) 1.7s both"/>
  <style>@keyframes tagIn { from { fill-opacity: 0; } to { fill-opacity: 1; } }</style>
  <text class="a" x="64" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="17" xml:space="preserve" style="animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) 1.85s both"><tspan fill="#656D76" style="animation: tagIn .5s ease-out 1.90s both">architecture</tspan><tspan fill="#0969DA" style="animation: tagIn .5s ease-out 2.05s both">  ·  </tspan><tspan fill="#656D76" style="animation: tagIn .5s ease-out 2.20s both">applied ai</tspan><tspan fill="#0969DA" style="animation: tagIn .5s ease-out 2.35s both">  ·  </tspan><tspan fill="#656D76" style="animation: tagIn .5s ease-out 2.50s both">full-stack</tspan></text>
  <g stroke="#D0D7DE" stroke-width="2" fill="none">
    <line x1="980" y1="150" x2="880" y2="90" pathLength="1" stroke-dasharray="1" style="animation: draw .7s ease-out 0.50s both"/>
    <line x1="980" y1="150" x2="1100" y2="100" pathLength="1" stroke-dasharray="1" style="animation: draw .7s ease-out 0.60s both"/>
    <line x1="980" y1="150" x2="940" y2="230" pathLength="1" stroke-dasharray="1" style="animation: draw .7s ease-out 0.70s both"/>
    <line x1="980" y1="150" x2="1080" y2="220" pathLength="1" stroke-dasharray="1" style="animation: draw .7s ease-out 0.80s both"/>
    <line x1="880" y1="90" x2="940" y2="230" pathLength="1" stroke-dasharray="1" style="animation: draw .7s ease-out 0.90s both"/>
    <line x1="1100" y1="100" x2="1080" y2="220" pathLength="1" stroke-dasharray="1" style="animation: draw .7s ease-out 1.00s both"/>
    <line x1="1100" y1="100" x2="1150" y2="170" pathLength="1" stroke-dasharray="1" style="animation: draw .7s ease-out 1.10s both"/>
    <line x1="1080" y1="220" x2="1150" y2="170" pathLength="1" stroke-dasharray="1" style="animation: draw .7s ease-out 1.20s both"/>
    <line x1="880" y1="90" x2="840" y2="175" pathLength="1" stroke-dasharray="1" style="animation: draw .7s ease-out 1.30s both"/>
    <line x1="840" y1="175" x2="940" y2="230" pathLength="1" stroke-dasharray="1" style="animation: draw .7s ease-out 1.40s both"/>
  </g>
  <g class="motion">
    <circle r="3.5" fill="#8250DF" opacity="0"><animateMotion path="M880 90 L980 150" dur="1.6s" begin="2.20s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="1.6s" begin="2.20s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#0969DA" opacity="0"><animateMotion path="M980 150 L1100 100" dur="2.0s" begin="2.55s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.0s" begin="2.55s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#0969DA" opacity="0"><animateMotion path="M940 230 L980 150" dur="2.4s" begin="2.90s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.4s" begin="2.90s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#8250DF" opacity="0"><animateMotion path="M980 150 L1080 220" dur="1.6s" begin="3.25s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="1.6s" begin="3.25s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#0969DA" opacity="0"><animateMotion path="M940 230 L880 90" dur="2.0s" begin="3.60s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.0s" begin="3.60s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#0969DA" opacity="0"><animateMotion path="M1100 100 L1080 220" dur="2.4s" begin="3.95s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.4s" begin="3.95s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#8250DF" opacity="0"><animateMotion path="M1150 170 L1100 100" dur="1.6s" begin="4.30s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="1.6s" begin="4.30s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#0969DA" opacity="0"><animateMotion path="M1080 220 L1150 170" dur="2.0s" begin="4.65s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.0s" begin="4.65s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#0969DA" opacity="0"><animateMotion path="M840 175 L880 90" dur="2.4s" begin="5.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.4s" begin="5.00s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#8250DF" opacity="0"><animateMotion path="M840 175 L940 230" dur="1.6s" begin="5.35s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="1.6s" begin="5.35s" repeatCount="indefinite"/></circle>
  </g>
  <circle class="a motion" cx="980" cy="150" r="12" fill="none" stroke="#0969DA" stroke-width="2" style="animation: ring 2.4s ease-out 2.0s infinite both"/>
  <circle class="a motion" cx="980" cy="150" r="12" fill="none" stroke="#0969DA" stroke-width="2" style="animation: ring 2.4s ease-out 3.2s infinite both"/>
  <circle class="a" cx="980" cy="150" r="12" fill="#0969DA" style="animation: pop 0.6s cubic-bezier(.2,.8,.2,1) 1.3s both"/>
  <circle class="a" cx="880" cy="90" r="8" fill="#FFFFFF" stroke="#656D76" stroke-width="2" style="animation: pop 0.5s cubic-bezier(.2,.8,.2,1) 1.4s both"/>
  <circle class="a" cx="1100" cy="100" r="8" fill="#FFFFFF" stroke="#656D76" stroke-width="2" style="animation: pop 0.5s cubic-bezier(.2,.8,.2,1) 1.5s both"/>
  <circle class="a" cx="940" cy="230" r="8" fill="#FFFFFF" stroke="#656D76" stroke-width="2" style="animation: pop 0.5s cubic-bezier(.2,.8,.2,1) 1.6s both"/>
  <circle class="a" cx="1080" cy="220" r="8" fill="#FFFFFF" stroke="#656D76" stroke-width="2" style="animation: pop 0.5s cubic-bezier(.2,.8,.2,1) 1.7s both"/>
  <circle class="a" cx="1150" cy="170" r="6" fill="#FFFFFF" stroke="#8250DF" stroke-width="2" style="animation: pop 0.5s cubic-bezier(.2,.8,.2,1) 1.8s both"/>
  <circle class="a" cx="840" cy="175" r="6" fill="#FFFFFF" stroke="#8250DF" stroke-width="2" style="animation: pop 0.5s cubic-bezier(.2,.8,.2,1) 1.9s both"/>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="none" stroke="#D0D7DE" stroke-width="2"/>
</svg>
