<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Now: learning, building and sharing around applied AI and software architecture. Principles: simple over clever, tested over assumed, shipped over perfect.">
  <style>
    .a { transform-box: fill-box; transform-origin: center; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fadeRight { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.2); } 65% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes ring { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(3.4); opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: .75; transform: scale(1.06); } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    @keyframes nudge { 0%, 70%, 100% { transform: translateX(0); } 80% { transform: translateX(5px); } }
    @keyframes sweep { from { transform: translateX(-420px) skewX(-20deg); } to { transform: translateX(1620px) skewX(-20deg); } }
    @keyframes gone { to { opacity: 0; visibility: hidden; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .motion { display: none; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="228" rx="16"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#30363D"/></pattern>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="228" rx="16" fill="#0D1117"/>
  <rect x="1" y="1" width="1198" height="228" rx="16" fill="url(#dots)" opacity=".45"/>
  <text x="64" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="17" fill="#58A6FF">$ now</text>
  <rect class="motion" x="62" y="53" width="57" height="25" fill="#0D1117" style="transform-box: view-box; animation: typeCover5_17 0.5s steps(5) 0.2s both, gone .01s linear 0.70s forwards"/>
  <style>@keyframes typeCover5_17 { from { transform: translateX(0); } to { transform: translateX(57.0px); } } @keyframes typeCursor5_17 { from { transform: translateX(0); } to { transform: translateX(51.0px); } }</style>
  <g class="motion" style="transform-box: view-box; animation: typeCursor5_17 0.5s steps(5) 0.2s both"><rect x="66" y="56" width="9" height="17" fill="#58A6FF" style="animation: blink 1s step-end 0.2s infinite"/></g>
  <text class="a" x="64" y="112" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#E6EDF3" style="animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) 0.9s both">Learning, building and sharing</text>
  <text class="a" x="64" y="144" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#E6EDF3" style="animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) 1.08s both">around applied AI and</text>
  <text class="a" x="64" y="176" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#E6EDF3" style="animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) 1.26s both">software architecture.</text>
  <line x1="620" y1="48" x2="620" y2="182" stroke="#30363D" stroke-width="1.5" pathLength="1" stroke-dasharray="1" style="animation: draw .8s ease-out .6s both"/>
  <text x="668" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="17" fill="#58A6FF">$ cat principles.txt</text>
  <rect class="motion" x="666" y="53" width="210" height="25" fill="#0D1117" style="transform-box: view-box; animation: typeCover20_17 0.8s steps(20) 0.8s both, gone .01s linear 1.60s forwards"/>
  <style>@keyframes typeCover20_17 { from { transform: translateX(0); } to { transform: translateX(210.0px); } } @keyframes typeCursor20_17 { from { transform: translateX(0); } to { transform: translateX(204.0px); } }</style>
  <g class="a" style="animation: fadeRight 0.6s cubic-bezier(.2,.8,.2,1) 1.8s both">
    <text class="a" x="668" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="18" fill="#58A6FF" style="animation: nudge 3s ease-in-out 3.0s infinite">›</text>
    <text x="692" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="18" fill="#E6EDF3">Simple over clever.</text>
  </g>
  <g class="a" style="animation: fadeRight 0.6s cubic-bezier(.2,.8,.2,1) 2.05s both">
    <text class="a" x="668" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="18" fill="#BC8CFF" style="animation: nudge 3s ease-in-out 3.4s infinite">›</text>
    <text x="692" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="18" fill="#E6EDF3">Tested over assumed.</text>
  </g>
  <g class="a" style="animation: fadeRight 0.6s cubic-bezier(.2,.8,.2,1) 2.3s both">
    <text class="a" x="668" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="18" fill="#58A6FF" style="animation: nudge 3s ease-in-out 3.8s infinite">›</text>
    <text x="692" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="18" fill="#E6EDF3">Shipped over perfect.</text>
  </g>
  <g clip-path="url(#card)" class="motion"><rect x="0" y="-40" width="260" height="310" fill="url(#band)" style="animation: sweep 7s ease-in-out 2.2s infinite both"/></g>
  <rect x="1" y="1" width="1198" height="228" rx="16" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>
