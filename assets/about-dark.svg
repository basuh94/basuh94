<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="About: software architecture, applied AI and agents, full-stack">
  <style>
    .a { transform-box: fill-box; transform-origin: center; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fadeRight { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.2); } 65% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes ring { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(3.4); opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: .75; transform: scale(1.06); } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    @keyframes nudge { 0%, 70%, 100% { transform: translateX(0); } 80% { transform: translateX(5px); } }
    @keyframes sweep { from { transform: translateX(-420px) skewX(-20deg); } to { transform: translateX(1620px) skewX(-20deg); } }
    @keyframes gone { to { opacity: 0; visibility: hidden; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .motion { display: none; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="358" rx="16"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#30363D"/></pattern>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="#0D1117"/>
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="url(#dots)" opacity=".45"/>
  <text x="64" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="17" fill="#58A6FF">$ cat about.md</text>
  <rect class="motion" x="62" y="53" width="148.79999999999998" height="25" fill="#0D1117" style="transform-box: view-box; animation: typeCover14_17 0.7s steps(14) 0.2s both, gone .01s linear 0.90s forwards"/>
  <style>@keyframes typeCover14_17 { from { transform: translateX(0); } to { transform: translateX(148.8px); } } @keyframes typeCursor14_17 { from { transform: translateX(0); } to { transform: translateX(142.8px); } }</style>
  <text class="a" x="64" y="112" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#E6EDF3" style="animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) 0.9s both">I'm a software engineer who builds maintainable systems that actually ship.</text>
  <text class="a" x="64" y="144" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#E6EDF3" style="animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) 1.08s both">I care about clear architecture, solid foundations and software people use.</text>
  <g class="a" style="animation: fadeUp 0.7s cubic-bezier(.2,.8,.2,1) 1.3s both">
  <rect x="64" y="178" width="344" height="140" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect class="a" x="88" y="204" width="10" height="10" rx="2" fill="#58A6FF" style="animation: beat 2.4s ease-in-out 2.4s infinite"/>
  <text class="a" x="108" y="214" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#E6EDF3">Software architecture</text>
  <text class="a" x="88" y="248" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#8B949E">Clean and hexagonal design,</text>
  <text class="a" x="88" y="271" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#8B949E">modular systems and decisions</text>
  <text class="a" x="88" y="294" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#8B949E">that age well.</text>
  </g>
  <g class="a" style="animation: fadeUp 0.7s cubic-bezier(.2,.8,.2,1) 1.5s both">
  <rect x="428" y="178" width="344" height="140" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect class="a" x="452" y="204" width="10" height="10" rx="2" fill="#BC8CFF" style="animation: beat 2.4s ease-in-out 3.2s infinite"/>
  <text class="a" x="472" y="214" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#E6EDF3">Applied AI &amp; agents</text>
  <text class="a" x="452" y="248" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#8B949E">LLM-powered products and</text>
  <text class="a" x="452" y="271" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#8B949E">agentic workflows, kept reliable</text>
  <text class="a" x="452" y="294" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#8B949E">with automated guardrails.</text>
  </g>
  <g class="a" style="animation: fadeUp 0.7s cubic-bezier(.2,.8,.2,1) 1.7s both">
  <rect x="792" y="178" width="344" height="140" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect class="a" x="816" y="204" width="10" height="10" rx="2" fill="#58A6FF" style="animation: beat 2.4s ease-in-out 4.0s infinite"/>
  <text class="a" x="836" y="214" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#E6EDF3">Full-stack</text>
  <text class="a" x="816" y="248" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#8B949E">From interfaces to APIs</text>
  <text class="a" x="816" y="271" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#8B949E">and data, end to end.</text>
  </g>
  <g clip-path="url(#card)" class="motion"><rect x="0" y="-40" width="260" height="440" fill="url(#band)" style="animation: sweep 7s ease-in-out 2.2s infinite both"/></g>
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>
